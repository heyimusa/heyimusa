<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-first delivery loop</title>
  <desc id="desc">A pull request is rendered, inspected as static evidence, reviewed by a human, delivered in a controlled manner, and verified through observable outcomes.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1200" height="290" rx="18" fill="#020617"/>
  <rect x="1" y="1" width="1198" height="288" rx="17" fill="url(#grid)" stroke="#1e293b"/>
  <text x="54" y="52" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">EVIDENCE-FIRST DELIVERY LOOP</text>
  <circle cx="36" cy="46" r="5" fill="#34d399"/>
  <text x="54" y="76" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">inspect → decide → change → observe</text>

  <g stroke="#67e8f9" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 244 160 H 286"/>
    <path d="M 468 160 H 510"/>
    <path d="M 692 160 H 734"/>
    <path d="M 916 160 H 958"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(58 116)">
      <rect width="186" height="92" rx="10" fill="#082f49" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="18" y="38" fill="#cffafe" font-size="15" font-weight="700">PULL REQUEST</text>
      <text x="18" y="64" fill="#67e8f9" font-size="11">intent + source diff</text>
    </g>
    <g transform="translate(286 116)">
      <rect width="182" height="92" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
      <text x="18" y="38" fill="#d1fae5" font-size="15" font-weight="700">RENDER</text>
      <text x="18" y="64" fill="#6ee7b7" font-size="11">effective configuration</text>
    </g>
    <g transform="translate(510 116)">
      <rect width="182" height="92" rx="10" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="18" y="38" fill="#ede9fe" font-size="15" font-weight="700">EVIDENCE</text>
      <text x="18" y="64" fill="#c4b5fd" font-size="11">facts + unknowns</text>
    </g>
    <g transform="translate(734 116)">
      <rect width="182" height="92" rx="10" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="18" y="38" fill="#fef3c7" font-size="15" font-weight="700">APPROVAL</text>
      <text x="18" y="64" fill="#fcd34d" font-size="11">human decision boundary</text>
    </g>
    <g transform="translate(958 116)">
      <rect width="184" height="92" rx="10" fill="#4c0519" stroke="#fb7185" stroke-width="1.5"/>
      <text x="18" y="38" fill="#ffe4e6" font-size="15" font-weight="700">DELIVERY</text>
      <text x="18" y="64" fill="#fda4af" font-size="11">controlled + observable</text>
    </g>
  </g>
  <text x="600" y="252" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Automation produces evidence; people retain authority over consequential change.</text>
</svg>
